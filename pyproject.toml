[project]
name = "paimon"
version = "0.1.0.dev0"
description = "A foundation for a persistent, learning desktop agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
paimon = "paimon.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paimon"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
