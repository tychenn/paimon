[project]
name = "volition"
version = "0.1.0.dev0"
description = "A foundation for a persistent, learning desktop agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.scripts]
volition = "volition.cli:main"
volition-guest = "volition.guest:main"

[project.optional-dependencies]
guest = [
    "pyobjc-framework-ApplicationServices>=12,<14; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12,<14; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volition"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
